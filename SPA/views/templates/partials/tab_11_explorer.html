<!-- Tab 11: Unified Corpus Explorer & Scriptable Console -->
<div id="tab_11" class="tab-pane">
  <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <input type="text" id="t11-input-term" class="form-input" value="bilim-kurgu" placeholder="Explorer search term..." style="flex:1; min-width:200px; max-width:300px;" />
    <button class="btn btn-sm btn-primary" id="t11-btn-run-console">Quick Search</button>
    <button class="btn btn-sm btn-secondary" id="t11-btn-evict-all" title="Evict all loaded text tables from RAM">🗑️ Evict All RAM</button>
    <span class="chip" id="t11-hits-badge" style="margin-left:auto;">0 hits</span>
    <span class="chip" id="t11-ram-badge" style="background:#1e293b; color:var(--accent-teal);">RAM: - MB</span>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <!-- Live Corpus Explorer Results -->
    <div class="kpi-card">
      <div style="font-weight:700; font-size:12.5px; color:var(--accent-blue); margin-bottom:6px;">Corpus Presence & KWIC Samples</div>
      <div style="font-size:11.5px; margin-bottom:10px;">
        <span style="color:var(--text-muted);">Texts Present:</span> <b id="t11-presence-text" style="color:var(--text-primary);">-</b>
      </div>
      <div id="t11-samples-container"></div>
    </div>

    <!-- Scriptable Python Console Twin -->
    <div class="kpi-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-weight:700; font-size:12.5px; color:var(--accent-teal);">Scriptable Python Twin</span>
        <button class="btn btn-sm" id="t11-btn-copy-script">Copy Python Snippet</button>
      </div>
      <textarea id="t11-python-snippet" readonly style="width:100%; height:260px; background:#0f172a; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px; color:var(--accent-teal); font-family:var(--font-mono); font-size:11.5px; resize:none; outline:none;"></textarea>
    </div>
  </div>
</div>
