<!-- Tab 5: Syntactic Dependency (displaCy UD) Studio -->
<div id="tab_05" class="tab-pane">
  <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">Select Sentence:</span>
    <input type="text" id="t5-input-text" class="form-input" value="BR-SM" placeholder="Text Code" style="width:90px;" />
    <input type="number" id="t5-input-ch" class="form-input" value="1" min="1" placeholder="Ch" style="width:60px;" />
    <input type="number" id="t5-input-p" class="form-input" value="1" min="1" placeholder="P" style="width:60px;" />
    <input type="number" id="t5-input-s" class="form-input" value="1" min="1" placeholder="S" style="width:60px;" />
    <button class="btn btn-sm btn-primary" id="t5-btn-render-tree">Render Dependency Tree</button>
    <button class="btn btn-sm" id="t5-btn-download-svg">Download SVG</button>
  </div>

  <!-- Dependency Tree Visualizer Stage -->
  <div class="kpi-card" style="margin-bottom:16px;">
    <div style="font-weight:700; font-size:12.5px; color:var(--accent-blue); margin-bottom:8px;">displaCy Universal Dependencies Tree (Function Words Dimmed)</div>
    <div id="t5-tree-stage" style="overflow-x:auto; min-height:220px; display:flex; align-items:center; justify-content:center; background:#ffffff; border-radius:var(--radius-sm); padding:10px;">
      <div style="color:#64748b;">Click 'Render Dependency Tree' to display syntax arcs</div>
    </div>
  </div>

  <!-- Token-by-Token CoNLL Table -->
  <div class="kpi-card">
    <div style="font-weight:700; font-size:12.5px; color:var(--text-primary); margin-bottom:8px;">Token-by-Token CoNLL Tuples</div>
    <div id="t5-conll-grid"></div>
  </div>
</div>
