<!-- Corpus Info & Sources Modal with Book Covers & Author Portraits -->
<div id="corpus-info-modal" class="modal-overlay">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-title">Corpus Info, Source Texts & Author Dossiers</div>
      <button class="drawer-close" id="btn-close-corpus-info">×</button>
    </div>
    <div class="modal-body">
      <h4 style="color:var(--accent-blue); font-size:13px; margin-bottom:8px;">1. Examined SF Books (18 Books in Thesis Subcorpus)</h4>
      <div id="modal-books-list" style="margin-bottom:18px;"></div>

      <h4 style="color:var(--accent-teal); font-size:13px; margin-bottom:8px;">2. Author-Translator Profiles (8 Author-Translators)</h4>
      <div id="modal-authors-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="window.corpusInfoModal.close();">Close</button>
    </div>
  </div>
</div>
