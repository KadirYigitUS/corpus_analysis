<!-- Tab 10: Sublinear TF-IDF Keyness & Research Reporter -->
<div id="tab_10" class="tab-pane">
  <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
    <div style="display:flex; gap:10px; align-items:center;">
      <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">Top K:</span>
      <input type="number" id="t10-input-topk" class="form-input" value="15" min="5" max="50" style="width:60px;" />
      <label style="font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer;">
        <input type="checkbox" id="t10-check-exclude-propn" checked /> Exclude PROPN (Proper Nouns)
      </label>
      <button class="btn btn-sm btn-primary" id="t10-btn-run-tfidf" onclick="if(window.initTab10Viz) window.initTab10Viz();">Extract Keyness</button>
    </div>
    <button class="btn btn-sm btn-primary" id="t10-btn-download-bundle" style="background:#059669; border-color:#047857;">
      📦 Download Research Bundle (.zip)
    </button>
  </div>

  <!-- Sub-tab Pills -->
  <div class="viz-subtabs-bar" id="t10-subtabs">
    <button class="viz-subtab-btn active" data-pane="t10-pane-keywords">Ayırt Edici Terimler (Çubuklar)</button>
    <button class="viz-subtab-btn" data-pane="t10-pane-heatmap">Şekil 6: TF-IDF Isı Haritası</button>
    <button class="viz-subtab-btn" data-pane="t10-pane-report-preview">Bölüm 12: Canlı Rapor Önizleme</button>
  </div>

  <!-- Pane 1: Keywords Bar Grid -->
  <div id="t10-pane-keywords" class="viz-pane active">
    <div id="t10-keywords-container"></div>
  </div>

  <!-- Pane 2: Şekil 6 Heatmap -->
  <div id="t10-pane-heatmap" class="viz-pane">
    <div id="t10-heatmap-chart-container"></div>
  </div>

  <!-- Pane 3: Canlı Araştırma Raporu & Veri-Kanıt Özeti -->
  <div id="t10-pane-report-preview" class="viz-pane">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="kpi-card">
        <div style="font-weight:700; font-size:12.5px; color:var(--accent-blue); margin-bottom:8px;">Canlı Markdown Raporu (CorpusReporter)</div>
        <div id="t10-report-markdown-preview"></div>
      </div>
      <div class="kpi-card">
        <div style="font-weight:700; font-size:12.5px; color:var(--accent-teal); margin-bottom:8px;">Veri-Kanıt Sözleşmesi Özeti (top_bottom_summary)</div>
        <div id="t10-report-summary-table"></div>
      </div>
    </div>
  </div>
</div>
