<!-- Tab 6: Corpus Search & 5-View KWIC Concordancer -->
<div id="tab_06" class="tab-pane">
  <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
    <input type="text" id="t6-input-query" class="form-input" value="robot" placeholder="Query term(s)..." style="width:180px;" />
    <select id="t6-select-match" class="form-select">
      <option value="exact">Exact Match</option>
      <option value="glob">Glob Pattern (*)</option>
      <option value="regex">Regular Expression</option>
    </select>
    <span style="font-size:11.5px; color:var(--text-secondary);">Span:</span>
    <input type="number" id="t6-input-span-l" class="form-input" value="5" min="1" max="20" style="width:50px;" title="Left Span" />
    <input type="number" id="t6-input-span-r" class="form-input" value="5" min="1" max="20" style="width:50px;" title="Right Span" />
    <select id="t6-select-sort" class="form-select">
      <option value="position">Sort: Position</option>
      <option value="node">Sort: Node</option>
      <option value="R1">Sort: R1 (First Right)</option>
      <option value="L1">Sort: L1 (First Left)</option>
    </select>
    <button class="btn btn-sm btn-primary" id="t6-btn-search">Search KWIC</button>
    <button class="btn btn-sm" id="t6-btn-punct-compare">Compare 4 Punctuations</button>
    <span class="chip" id="t6-hit-count" style="margin-left:auto;">0 hits</span>
  </div>

  <div id="t6-punct-pane" class="kpi-card" style="display:none; margin-bottom:12px;"></div>

  <!-- KWIC Table -->
  <div id="t6-kwic-grid"></div>
</div>
