# Corpus Analysis SPA Author & Book Metadata Registry
# Editable at runtime via Corpus Info Modal and /api/v1/config/corpus-metadata

authors:
  - code: "SM"
    full_name: "Selma Mine"
    birth_year: 1947
    role: "Author-Translator (Pioneer First Generation)"
    bio_summary: "First female science fiction translator and author in Turkey; translated Asimov's I, Robot and authored OBI."
    portrait_image: "/static/img/authors/SM.svg"
  - code: "ZB"
    full_name: "Zühtü Bayar"
    birth_year: 1943
    role: "Author-Translator (Pioneer First Generation)"
    bio_summary: "Pioneer Turkish SF poet, critic and author-translator; translated Heinlein, London and authored SU."
    portrait_image: "/static/img/authors/ZB.svg"
  - code: "OK"
    full_name: "Özlem Kurdoğlu"
    birth_year: 1965
    role: "Author-Translator (Pioneer First Generation)"
    bio_summary: "Founding member of Turkish SF fandom, translator of Philip K. Dick, author of Son Tiryaki and SCS."
    portrait_image: "/static/img/authors/OK.svg"
  - code: "NCK"
    full_name: "N. Can Kantarcı"
    birth_year: 1978
    role: "Author-Translator"
    bio_summary: "Prolific contemporary translator and cyberpunk novelist."
    portrait_image: "/static/img/authors/NCK.svg"
  - code: "AS"
    full_name: "Algan Sezgintüredi"
    birth_year: 1968
    role: "Author-Translator"
    bio_summary: "Translator of Arthur C. Clarke and speculative fiction novelist."
    portrait_image: "/static/img/authors/AS.svg"
  - code: "CE"
    full_name: "Çiğdem Erkal"
    birth_year: 1962
    role: "Author-Translator"
    bio_summary: "Academic and master translator of Ursula K. Le Guin and J.R.R. Tolkien."
    portrait_image: "/static/img/authors/CE.svg"
  - code: "SG"
    full_name: "Sabri Gürses"
    birth_year: 1972
    role: "Author-Translator"
    bio_summary: "Distinguished translator of Russian literature and SF, author of indigenous SF novels."
    portrait_image: "/static/img/authors/SG.svg"
  - code: "DK"
    full_name: "Dost Körpe"
    birth_year: 1972
    role: "Author-Translator"
    bio_summary: "Translator of Frank Herbert's Dune and modern speculative fiction."
    portrait_image: "/static/img/authors/DK.svg"

